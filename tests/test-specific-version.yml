name: Test nuclei scan with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: http://scanme.sh
          nuclei-version: "v3.2.0"
          flags: "-duc -timeout 5 -retries 1 -severity info,low -stats -silent"

      - name: Assert action ran with specific nuclei version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: nuclei scan with specific version completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (nuclei may have found no results or scan timed out, which is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
