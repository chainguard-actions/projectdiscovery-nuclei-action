name: Test nuclei scan with SARIF export
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: http://scanme.sh
          sarif-export: /tmp/nuclei-results.sarif
          flags: "-duc -timeout 5 -retries 1 -severity info,low -stats -silent"

      - name: Assert action ran with SARIF export
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: nuclei scan with SARIF export completed successfully"
            if [ -f /tmp/nuclei-results.sarif ]; then
              echo "PASS: SARIF file was created"
            else
              echo "INFO: SARIF file not found (may be empty if no findings)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (nuclei may have found no results or scan timed out, which is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
