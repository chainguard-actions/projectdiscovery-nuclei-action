name: Test workflows input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal nuclei workflow file
        run: |
          mkdir -p /tmp/nuclei-workflows
          cat > /tmp/nuclei-workflows/test-workflow.yaml << 'EOF'
          id: test-workflow
          info:
            name: Test Workflow
            author: test
            severity: info
          workflows:
            - template: http/technologies/
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: "https://example.com"
          workflows: "/tmp/nuclei-workflows/test-workflow.yaml"
      - name: Assert action ran with workflows input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with workflows input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
