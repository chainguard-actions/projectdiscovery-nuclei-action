name: Test args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          install-only: "true"
          args: "-version"
          token: ${{ github.token }}
      - name: Assert nuclei is installed
        run: |
          if ! command -v nuclei &>/dev/null; then
            echo "FAIL: nuclei binary not found on PATH"
            exit 1
          fi
          echo "PASS: nuclei is installed"
