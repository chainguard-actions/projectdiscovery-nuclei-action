name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal nuclei config file
        run: |
          mkdir -p /tmp/nuclei-config
          cat > /tmp/nuclei-config/nuclei-config.yaml << 'EOF'
          # Nuclei configuration file
          rate-limit: 10
          bulk-size: 5
          concurrency: 5
          timeout: 5
          retries: 1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: "https://example.com"
          config: "/tmp/nuclei-config/nuclei-config.yaml"
          templates: "http/technologies/"
      - name: Assert action ran with config input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
